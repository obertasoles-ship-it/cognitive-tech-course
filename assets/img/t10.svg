  <text x="495" y="258" font-size="18" fill="#1F3864" font-family="Consolas, monospace">s = v · t → t = s / v</text>
  <text x="400" y="360" font-size="16" fill="#1F3864" text-anchor="middle" font-weight="600">Хороший тьютор питає й підказує, а не розв'язує за тебе</text>
